name: Release consistency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'refs/heads/main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify versions, homepage and installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-release.mjs
          else
            node scripts/check-release.mjs --github
          fi
